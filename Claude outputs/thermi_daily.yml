name: Daily ThermiAir PurpleAir QC run

on:
  schedule:
    # 04:00 UTC daily = after the previous full UTC day has closed out.
    # Adjust to your preference; Thermi is UTC+2/+3, same as Patras.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to analyze (YYYY-MM-DD). Leave blank for yesterday (UTC)."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        run: python scripts/fetch_data.py "${{ github.event.inputs.date }}"

      - name: Analyze
        run: python scripts/analyze.py "${{ github.event.inputs.date }}"

      - name: Commit updated data + site
        run: |
          git config user.name "thermiair-qc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data data/results
          git diff --staged --quiet || git commit -m "Daily QC run: $(date -u +%Y-%m-%d)"
          git push

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: fetch-and-analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
